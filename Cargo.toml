[package]
name = "tree-sitter-surrealql"
version = "0.1.0"
edition = "2021"
description = "Tree-sitter grammar for SurrealQL"
license = "MIT"
build = "bindings/rust/build.rs"
include = [
    "bindings/rust/*",
    "grammar.js",
    "src/*",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[dev-dependencies]
tree-sitter = "0.26"

[build-dependencies]
cc = "1"
