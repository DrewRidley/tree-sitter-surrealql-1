# CodeQL configuration for the SurrealQL grammar.
#
# The point of this file is `paths-ignore`. `src/parser.c` is 5.8 MB of
# generated C — tree-sitter writes it from `grammar.js` and it is committed so
# that consumers need no build step. Nobody reviews it, a one-line grammar
# change rewrites thousands of its lines, and asking an analyser to read it
# wastes the whole run.
#
# What is NOT ignored is the code this repo actually writes: `grammar.js`,
# `src/scanner.c` (the hand-written external scanner) and the TypeScript
# helpers.

name: surrealql-tree-sitter

paths-ignore:
  # Generated by `tree-sitter generate` — see `npm run gen`.
  - src/parser.c
  - src/grammar.json
  - src/node-types.json
  # Vendored with the generated parser, not written here.
  - src/tree_sitter/**
  # Corpus fixtures and benchmark inputs: SurrealQL text, not program source.
  - test/**
  - bench/**
